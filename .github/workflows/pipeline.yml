name: Test Pipeline

on:
  pull_request:
    branches:
      - github-actions-pipeline
  push:
    branches:
      - github-actions-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y redis-server firejail jq tree

      - name: Setup Virtual Environment & Install Python Libraries
        run: |
          python3 -m venv ~/.venv
          source ~/.venv/bin/activate
          pip install -r templates/out_of_the_box/requirements.txt

      - name: Run Builder Script
        run: |
          source ~/.venv/bin/activate
          rm -rf Labs/packageIG_L1 Labs/packageIG_L1.zip
          START_DATE=$(date -d '5 minutes ago' +%Y-%m-%d)
          START_TIME=$(date -d '5 minutes ago' +%H%M)

          python3 builder.py <<EOF





          ${START_DATE}
          ${START_TIME}
          1440

          .github/workflows/demo_data/students.txt
          .github/workflows/demo_data/pwd_students.txt
          .github/workflows/demo_data/APL1.pdf

          5



          n

          .github/workflows/demo_data/testcases/Q1/public
          .github/workflows/demo_data/testcases/Q1/private

          .github/workflows/demo_data/Reference_solutions/Q1.c



          n

          .github/workflows/demo_data/testcases/Q2/public
          .github/workflows/demo_data/testcases/Q2/private

          .github/workflows/demo_data/Reference_solutions/Q2.c



          n

          .github/workflows/demo_data/testcases/Q3/public
          .github/workflows/demo_data/testcases/Q3/private

          .github/workflows/demo_data/Reference_solutions/Q3.c



          y


          .github/workflows/demo_data/testcases/Q4/public
          .github/workflows/demo_data/testcases/Q4/private

          .github/workflows/demo_data/Reference_solutions/Q4



          y


          .github/workflows/demo_data/testcases/Q5/public
          .github/workflows/demo_data/testcases/Q5/private
          .github/workflows/demo_data/testcases/Q5/public/static
          .github/workflows/demo_data/Reference_solutions/Q5
          EOF

      - name: List Created Files
        run: |
          echo "Listing generated profile configurations:"
          ls -la .builder_profiles.json || echo "No profile configuration found."
          
          echo "Listing generated Lab packages:"
          tree Labs/